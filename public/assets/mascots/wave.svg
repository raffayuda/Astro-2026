<style>
@media (prefers-reduced-motion: reduce) {
  [id="Group 40"], [id="Group 39"], [id="Vector 77"], [id="Vector 78"], [id="Vector 55"],
  [id="Ellipse 22"], [id="Ellipse 23"], [id="Star 3"], [id="Star 4"],
  [id="Rectangle 32"], [id="Rectangle 33"], [id="Ellipse 8"], [id="Ellipse 9"] { animation: none !important; }
}
[id="Group 40"], [id="Group 39"], [id="Vector 77"], [id="Vector 78"], [id="Vector 55"],
[id="Ellipse 22"], [id="Ellipse 23"], [id="Star 3"], [id="Star 4"],
[id="Rectangle 32"], [id="Rectangle 33"], [id="Ellipse 8"], [id="Ellipse 9"] {
  transform-box: fill-box;
}
[id="Group 40"] { transform-origin: 85% 90%; animation: earL 2.7s ease-in-out infinite; }
[id="Group 39"] { transform-origin: 15% 90%; animation: earR 2.7s ease-in-out infinite .18s; }
[id="Vector 77"] { transform-origin: 100% 30%; animation: armL 2.4s ease-in-out infinite; }
[id="Vector 78"] { transform-origin: 0% 30%; animation: armR 2.4s ease-in-out infinite .12s; }
[id="Vector 55"] { transform-origin: 0% 50%; animation: tail 2.1s ease-in-out infinite; }
[id="Ellipse 22"], [id="Ellipse 23"] { transform-origin: 50% 50%; animation: blink 4.4s ease-in-out infinite; }
[id="Star 3"] { transform-origin: 50% 50%; animation: twinkle 2.2s ease-in-out infinite; }
[id="Star 4"] { transform-origin: 50% 50%; animation: twinkle 2.2s ease-in-out infinite .35s; }
[id="Rectangle 32"], [id="Ellipse 8"] { transform-origin: center bottom; animation: antennaBob 2.3s ease-in-out infinite; }
[id="Rectangle 33"], [id="Ellipse 9"] { transform-origin: center bottom; animation: antennaBob 2.3s ease-in-out infinite .16s; }
@keyframes earL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
@keyframes earR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
@keyframes armL { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(-12deg); } 70% { transform: rotate(8deg); } }
@keyframes armR { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(12deg); } 70% { transform: rotate(-8deg); } }
@keyframes tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
@keyframes blink { 0%,88%,96%,100% { transform: scaleY(1); } 92% { transform: scaleY(0.08); } }
@keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.72); opacity: .45; } }
@keyframes antennaBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
</style>

